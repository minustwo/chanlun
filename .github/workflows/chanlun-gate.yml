name: chanlun-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: chanlun-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: lake build (Mathlib kernel CI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install elan + lean toolchain
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          # Force-install the toolchain pinned in lean-toolchain.
          TOOLCHAIN=$(cat lean-toolchain | sed 's|^leanprover/lean4:||' | tr -d '[:space:]')
          elan toolchain install "$TOOLCHAIN"
          elan default "$TOOLCHAIN"
          lean --version
          lake --version

      - name: Cache Lake + Mathlib oleans
        uses: actions/cache@v4
        with:
          path: |
            .lake
          key: chanlun-lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            chanlun-lake-${{ runner.os }}-

      - name: Resolve dependencies
        run: lake update

      - name: Download Mathlib oleans (cache get)
        run: |
          set -euo pipefail
          # Get Mathlib's pre-built oleans (the WIN — free hosted runners CAN reach this).
          lake exe cache get || true

      - name: Build Chanlun library
        run: lake build Chanlun

      - name: Sorry-free gate
        run: |
          set -euo pipefail
          # Hard fail if any Chanlun .lean file contains the keyword `sorry` (token-level).
          if grep -RIn --include='*.lean' -E '(^|[^[:alnum:]_])sorry([^[:alnum:]_]|$)' lean/Chanlun; then
            echo "FAIL: at least one Chanlun Lean file contains `sorry`."
            exit 1
          fi
          echo "OK: no sorries in lean/Chanlun/*.lean."

  grounding:
    name: Grounding (pure-Python oracles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run all groundings
        working-directory: grounding
        run: |
          set -euo pipefail
          status=0
          for f in chanlun_*_grounding.py; do
            echo "===== $f ====="
            if PYTHONPATH=. python3 "$f"; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              status=1
            fi
          done
          exit "$status"

  conformance:
    name: Conformance corpus (chanlun-v1)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run chanlun-v1 conformance runner
        run: |
          set -euo pipefail
          # SHA-equality is the law. A byte off = FAIL. The runner exits non-zero on any divergence.
          python3 conformance/chanlun-v1/runner.py

      - name: Regenerate corpus + verify byte-identical
        run: |
          set -euo pipefail
          # The corpus MUST be deterministic: regeneration produces byte-identical bytes. If the
          # reference backend drifts in any observable way, this job catches it BEFORE merging.
          sha_before=$(python3 -c "import hashlib; print(hashlib.sha256(open('conformance/chanlun-v1/manifest.json','rb').read()).hexdigest())")
          python3 conformance/chanlun-v1/generate_corpus.py
          sha_after=$(python3 -c "import hashlib; print(hashlib.sha256(open('conformance/chanlun-v1/manifest.json','rb').read()).hexdigest())")
          if [ "$sha_before" != "$sha_after" ]; then
            echo "FAIL: regeneration is NOT byte-identical."
            echo "  before: $sha_before"
            echo "  after:  $sha_after"
            echo "The reference backend has drifted - the frozen corpus would change."
            exit 1
          fi
          echo "OK: corpus regeneration is byte-identical (manifest sha = $sha_before)."

      - name: Phase-3 example check (template)
        run: |
          set -euo pipefail
          # The example phase-3 backend MUST pass too - the template stays correct.
          python3 conformance/chanlun-v1/example_phase3_check.py reference
          python3 conformance/chanlun-v1/example_phase3_check.py alt

  conformance-ts:
    name: Conformance corpus (chanlun-v1, TypeScript backend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install devDependencies (typescript + @types/node only)
        working-directory: impl/ts
        run: |
          set -euo pipefail
          # Pure devDeps: no runtime deps at all. --omit=optional keeps the
          # tree at the bare minimum (typescript + @types/node).
          npm ci --omit=optional || npm install --no-audit --no-fund

      - name: Compile TypeScript
        working-directory: impl/ts
        run: npx tsc

      - name: Run impl/ts conformance harness (48 fixtures)
        working-directory: impl/ts
        run: |
          set -euo pipefail
          # SHA-equality is the law. The harness exits non-zero on ANY divergence.
          node dist/check.js

  conformance-go:
    name: Conformance corpus (chanlun-v1, Go backend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go conformance backend
        working-directory: impl/go
        run: |
          set -euo pipefail
          go build ./...

      - name: Run Go conformance harness
        working-directory: impl/go
        run: |
          set -euo pipefail
          # SHA-equality is the law. A byte off = FAIL. The harness exits
          # non-zero on any divergence; the gate fails honestly, never silently.
          go run ./cmd/check

  conformance-java:
    name: Conformance corpus (chanlun-v1, Java backend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Java conformance backend
        working-directory: impl/java
        run: |
          set -euo pipefail
          mvn -B -q -DskipTests package

      - name: Run Java conformance harness (48 fixtures)
        working-directory: impl/java
        run: |
          set -euo pipefail
          # SHA-equality is the law. A byte off = FAIL. The harness exits
          # non-zero on any divergence; the gate fails honestly, never silently.
          java -jar target/chanlun-check.jar

  conformance-pinescript-lint:
    name: PineScript v5 port (discipline lint, not a conformance gate)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Run discipline lint on impl/pinescript
        run: |
          set -euo pipefail
          # This is NOT a conformance gate. PineScript v5 cannot read the chanlun-v1
          # fixture corpus or compare SHA-256 in CI. The lint verifies:
          #   (1) no look-ahead bias anti-patterns in chanlun_indicator.pine
          #   (2) all 14 named residues are present in PINESCRIPT_PORT.md
          #   (3) lineage + confirmation-lag commentary present
          # The conformance gap itself stays NAMED-OPEN as
          # [chanlun_v1_pinescript_conformance_OPEN] + [chanlun_v1_pinescript_ci_offline_harness_OPEN].
          bash impl/pinescript/lint_check.sh
